<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VERITAS — Investigator Console</title>
<style>
  :root{
    --ink:#12161D;
    --graphite:#1B212B;
    --graphite-2:#212836;
    --hairline:rgba(255,255,255,0.08);
    --hairline-strong:rgba(255,255,255,0.16);
    --text:#ECEAE3;
    --text-dim:#8F98AA;
    --text-faint:#5C6577;
    --paper:#F5F2EA;
    --paper-dim:#DCD8CC;
    --amber:#D98E3B;
    --amber-dim:rgba(217,142,59,0.18);
    --teal:#3F8C82;
    --teal-dim:rgba(63,140,130,0.18);
    --steel:#5B6478;
    --radius:14px;
    font-size:16px;
  }
  @media (prefers-contrast: more){
    :root{ --hairline:rgba(255,255,255,0.4); --text-dim:#C8CEDA; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(63,140,130,0.08), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(217,142,59,0.06), transparent 55%),
      var(--ink);
    color:var(--text);
    font:400 15px/1.5 -apple-system, ui-sans-serif, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Menlo", "Cascadia Code", monospace; letter-spacing:0.01em; }

  /* ---------- App shell ---------- */
  #app{ display:flex; flex-direction:column; height:100vh; }

  header.topbar{
    display:flex; align-items:center; gap:22px;
    padding:14px 22px;
    border-bottom:1px solid var(--hairline);
    background:rgba(27,33,43,0.7);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    flex-shrink:0;
    z-index:10;
  }
  @media (prefers-transparency: reduce){
    header.topbar{ background:var(--graphite); backdrop-filter:none; }
  }
  .brand{ display:flex; align-items:baseline; gap:9px; }
  .brand .mark{
    width:9px; height:9px; border-radius:2px;
    background:var(--amber);
    box-shadow:0 0 0 3px var(--amber-dim);
  }
  .brand h1{
    margin:0; font-size:15px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
  }
  .brand .case{
    font-size:12px; color:var(--text-faint);
    letter-spacing:0.04em;
  }

  .stepper{ display:flex; align-items:center; gap:0; flex:1; overflow:hidden; }
  .step{
    display:flex; align-items:center; gap:8px;
    padding:0 14px 0 0; position:relative;
    color:var(--text-faint); font-size:12px; letter-spacing:0.06em; white-space:nowrap;
  }
  .step .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--steel); flex-shrink:0;
    transition:background 320ms ease, box-shadow 320ms ease;
  }
  .step.done .dot{ background:var(--teal); box-shadow:0 0 0 3px var(--teal-dim); }
  .step.active .dot{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); animation:pulse-dot 1.6s ease-in-out infinite; }
  .step.done, .step.active{ color:var(--text); }
  .step:not(:last-child)::after{
    content:""; width:22px; height:1px; background:var(--hairline-strong); margin:0 10px;
  }
  @keyframes pulse-dot{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.35);} }
  @media (prefers-reduced-motion: reduce){ .step.active .dot{ animation:none; } }

  main.layout{
    flex:1; display:grid;
    grid-template-columns: 272px 1fr 340px;
    min-height:0;
  }

  .panel{
    border-right:1px solid var(--hairline);
    padding:18px 16px;
    overflow-y:auto;
    min-height:0;
  }
  .panel.right{ border-right:none; border-left:1px solid var(--hairline); }

  .panel h2{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--text-faint); margin:0 0 12px 0; font-weight:600;
  }

  /* ---------- Source intake ---------- */
  .source{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:10px;
    border:1px solid var(--hairline); margin-bottom:8px;
    background:rgba(255,255,255,0.02);
  }
  .source .icon{
    width:28px; height:28px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--graphite-2); color:var(--text-dim); font-size:10px; font-weight:700;
  }
  .source .meta{ min-width:0; flex:1; }
  .source .meta .name{ font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .source .meta .status{ font-size:10.5px; color:var(--text-faint); margin-top:1px; }
  .source.processed .icon{ background:var(--teal-dim); color:var(--teal); }
  .source.processed .status{ color:var(--teal); }

  button.run{
    width:100%; margin-top:14px; padding:11px 14px;
    border-radius:10px; border:1px solid var(--amber);
    background:var(--amber-dim); color:var(--amber);
    font-size:13px; font-weight:600; letter-spacing:0.03em;
    cursor:pointer; transition:transform 100ms ease-out, background 150ms ease;
  }
  button.run:active{ transform:scale(0.97); }
  button.run:disabled{ opacity:0.45; cursor:default; }
  button.run:not(:disabled):hover{ background:rgba(217,142,59,0.28); }

  .log{ margin-top:16px; }
  .log-line{
    font-size:11.5px; color:var(--text-dim); padding:4px 0;
    border-bottom:1px dashed var(--hairline); opacity:0;
    transform:translateY(4px);
  }
  .log-line.in{ opacity:1; transform:translateY(0); transition:opacity 260ms ease, transform 260ms ease; }
  .log-line b{ color:var(--text); font-weight:600; }

  /* ---------- Graph ---------- */
  .graph-wrap{ position:relative; overflow:hidden; background:
      radial-gradient(closest-side at 50% 45%, rgba(255,255,255,0.02), transparent);
  }
  .graph-caption{
    position:absolute; top:16px; left:18px; z-index:5;
    font-size:11px; color:var(--text-faint); letter-spacing:0.04em;
    display:flex; align-items:center; gap:8px;
  }
  .graph-caption strong{ color:var(--text-dim); font-weight:600; }
  .graph-hint{
    position:absolute; bottom:16px; left:18px; z-index:5;
    font-size:10.5px; color:var(--text-faint); opacity:0; transition:opacity 400ms ease;
  }
  .graph-hint.show{ opacity:1; }
  svg#graph{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  svg#graph.grabbing{ cursor:grabbing; }
  .node{ cursor:pointer; }
  .node circle.body{
    stroke-width:1.4; transition:stroke 200ms ease, stroke-width 200ms ease;
  }
  .node.selected circle.body{ stroke-width:2.4; }
  .node text{
    fill:var(--text); font-size:11px; font-family:-apple-system, ui-sans-serif, sans-serif;
    letter-spacing:0.01em; pointer-events:none;
  }
  .node text.sub{ fill:var(--text-faint); font-size:9px; }
  .node.flagged .ring{ animation:pulse-ring 2.2s ease-in-out infinite; transform-origin:center; }
  @keyframes pulse-ring{ 0%,100%{ opacity:0.55; r:26; } 50%{ opacity:0.05; r:34; } }
  @media (prefers-reduced-motion: reduce){ .node.flagged .ring{ animation:none; opacity:0.25; } }

  .edge{ stroke:var(--steel); stroke-width:1.2; fill:none; opacity:0.8; }
  .edge.flagged{ stroke:var(--amber); stroke-width:1.6; }
  .edge-label{ font-size:8.5px; fill:var(--text-faint); font-family:ui-monospace, monospace; }
  .edge-label.flagged{ fill:var(--amber); }

  /* ---------- Right panel content ---------- */
  .stack{ transition:opacity 200ms ease; }
  .metric-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; border-bottom:1px solid var(--hairline);
    font-size:12.5px;
  }
  .metric-row .n{ font-family:ui-monospace, monospace; color:var(--text); font-weight:600; font-size:13px; }
  .metric-row .k{ color:var(--text-dim); }

  .detail-title{ font-size:16px; font-weight:700; letter-spacing:-0.01em; margin:0 0 2px 0; }
  .detail-sub{ font-size:11.5px; color:var(--text-faint); margin-bottom:14px; }
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:100px; border:1px solid var(--amber);
    color:var(--amber); background:var(--amber-dim); margin-bottom:12px; font-weight:600;
  }
  .indicator-table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .indicator-table tr td{ padding:6px 0; border-bottom:1px solid var(--hairline); font-size:12px; }
  .indicator-table tr td:first-child{ color:var(--text-dim); }
  .indicator-table tr td:last-child{ text-align:right; font-family:ui-monospace,monospace; color:var(--text); font-weight:600; }
  .indicator-table tr td:last-child.up{ color:var(--amber); }

  .evidence-path{ margin-top:6px; margin-bottom:16px; }
  .hop{
    display:flex; align-items:flex-start; gap:10px;
    opacity:0; transform:translateX(-6px) scale(0.97);
    padding-bottom:12px; position:relative;
  }
  .hop.in{ opacity:1; transform:translateX(0) scale(1); transition:opacity 320ms ease, transform 320ms cubic-bezier(.2,.9,.3,1); }
  .hop:not(:last-child)::before{
    content:""; position:absolute; left:9px; top:22px; bottom:-2px; width:1px;
    background:repeating-linear-gradient(to bottom, var(--hairline-strong) 0 4px, transparent 4px 8px);
  }
  .hop .stamp{
    width:19px; height:19px; border-radius:5px; flex-shrink:0; margin-top:1px;
    background:var(--graphite-2); border:1px solid var(--hairline-strong);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--text-dim);
  }
  .hop.flag .stamp{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .hop .txt{ font-size:12px; color:var(--text); line-height:1.4; }
  .hop .txt .rel{ color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; }

  button.ghost{
    width:100%; padding:9px 12px; border-radius:9px;
    border:1px solid var(--hairline-strong); background:transparent; color:var(--text);
    font-size:12.5px; cursor:pointer; transition:transform 100ms ease-out, background 150ms ease;
  }
  button.ghost:active{ transform:scale(0.97); }
  button.ghost:hover{ background:rgba(255,255,255,0.04); }

  .empty-hint{ color:var(--text-faint); font-size:12.5px; line-height:1.6; }

  /* ---------- Modal (source viewer) ---------- */
  #modal-layer{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(9,11,15,0.55);
    backdrop-filter: blur(6px);
    opacity:0; pointer-events:none;
  }
  #modal-layer.open{ opacity:1; pointer-events:auto; transition:opacity 220ms ease; }
  .modal{
    width:min(520px, 90vw);
    background:var(--paper); color:#20242C;
    border-radius:16px; padding:22px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    transform:translateY(14px) scale(0.98); opacity:0;
  }
  #modal-layer.open .modal{ transform:translateY(0) scale(1); opacity:1; transition:transform 280ms cubic-bezier(.2,.9,.3,1), opacity 240ms ease; }
  .modal h3{ margin:0 0 4px 0; font-size:16px; letter-spacing:-0.01em; }
  .modal .doc-id{ font-family:ui-monospace,monospace; font-size:11px; color:#6B7280; margin-bottom:14px; }
  .modal .doc-body{
    font-size:13px; line-height:1.6; color:#34394A; background:#EDEAE0;
    border-radius:10px; padding:14px; margin-bottom:14px; border:1px solid #DCD8CC;
  }
  .modal .verify-row{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:#3F8C82; font-weight:600;
    margin-bottom:16px;
  }
  .modal .verify-row .check{
    width:16px; height:16px; border-radius:50%; background:#3F8C82; color:white;
    display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
  }
  .modal .hashrow{ font-family:ui-monospace,monospace; font-size:10.5px; color:#8A8F9C; margin-bottom:18px; word-break:break-all; }
  .modal button.close{
    padding:9px 16px; border-radius:9px; border:none; background:#20242C; color:#F5F2EA;
    font-size:12.5px; cursor:pointer; transition:transform 100ms ease-out;
  }
  .modal button.close:active{ transform:scale(0.96); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--hairline-strong); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <h1>Veritas</h1>
      <span class="case mono">CASE-102</span>
    </div>
    <div class="stepper" id="stepper"></div>
  </header>

  <main class="layout">

    <section class="panel left">
      <h2>Evidence Intake</h2>
      <div id="sources"></div>
      <button class="run" id="runBtn">Run pipeline</button>
      <div class="log" id="log"></div>
    </section>

    <section class="graph-wrap">
      <div class="graph-caption"><strong id="graphCount">6</strong>&nbsp;of&nbsp;438 entities shown &middot; flagged subnetwork</div>
      <svg id="graph" viewBox="0 0 880 520" preserveAspectRatio="xMidYMid meet">
        <g id="viewport"></g>
      </svg>
      <div class="graph-hint" id="graphHint">Drag to pan &middot; click a node to inspect</div>
    </section>

    <section class="panel right" id="rightPanel"></section>

  </main>
</div>

<div id="modal-layer">
  <div class="modal" id="modalBody"></div>
</div>

<script>
(function(){
  "use strict";
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- Spring engine ---------------- */
  class Spring{
    constructor(value, opts={}){
      this.value=value; this.velocity=opts.velocity||0; this.target=value;
      this.damping = opts.damping ?? 1.0;
      this.response = opts.response ?? 0.35;
      this.onUpdate = opts.onUpdate || (()=>{});
      this.onSettle = opts.onSettle || (()=>{});
      this._raf=null;
    }
    jump(v){ this.value=v; this.target=v; this.velocity=0; this.onUpdate(this.value); }
    set(target, velocityBoost){
      this.target = target;
      if (velocityBoost !== undefined) this.velocity = velocityBoost;
      if (reduced){ this.jump(target); this.onSettle(); return; }
      this._run();
    }
    _run(){
      if (this._raf) return;
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min((now-last)/1000, 0.032); last = now;
        const w = 2*Math.PI/this.response;
        const F = -2*this.damping*w*this.velocity - w*w*(this.value-this.target);
        this.velocity += F*dt;
        this.value += this.velocity*dt;
        this.onUpdate(this.value);
        if (Math.abs(this.value-this.target) < 0.05 && Math.abs(this.velocity) < 0.05){
          this.value = this.target; this.onUpdate(this.value);
          this._raf = null; this.onSettle();
          return;
        }
        this._raf = requestAnimationFrame(step);
      };
      this._raf = requestAnimationFrame(step);
    }
  }

  /* ---------------- Data model ---------------- */
  const PIPELINE = ["Ingest","Normalize","Extract","Resolve","Graph","Analyze","Explain","Verify"];
  const SOURCES = [
    {id:'fir1', name:'FIR_001.pdf', tag:'FIR'},
    {id:'fir2', name:'FIR_002.pdf', tag:'FIR'},
    {id:'cdr',  name:'CDR.csv', tag:'CDR'},
    {id:'txn',  name:'transactions.csv', tag:'TXN'},
  ];

  const NODES = [
    {id:'ravi',   label:'Ravi Kumar',            sub:'Person',   type:'person',  x:190, y:150},
    {id:'phone',  label:'9876543210',             sub:'Phone',    type:'phone',   x:170, y:290},
    {id:'vehicle',label:'TS09 AB 1234',           sub:'Vehicle',  type:'vehicle', x:60,  y:220},
    {id:'loc',    label:'Hyderabad Rly Station',  sub:'Location', type:'location',x:460, y:440},
    {id:'ahmed',  label:'Ahmed Sheikh',           sub:'Person',   type:'person',  x:540, y:150, flagged:true},
    {id:'acc1',   label:'A/C ••4521',             sub:'Account',  type:'account', x:540, y:290},
    {id:'org',    label:'Crescent Traders',       sub:'Organization', type:'org', x:690, y:90},
    {id:'acc2',   label:'A/C ••7788',             sub:'Account',  type:'account', x:730, y:360},
    {id:'faisal', label:'Faisal Khan',            sub:'Person',   type:'person',  x:800, y:460},
  ];
  const EDGES = [
    {from:'ravi', to:'phone', label:'USES'},
    {from:'ravi', to:'vehicle', label:'DRIVES'},
    {from:'ravi', to:'ahmed', label:'CALLED', flagged:true},
    {from:'ravi', to:'loc', label:'VISITED'},
    {from:'faisal', to:'loc', label:'VISITED'},
    {from:'ahmed', to:'acc1', label:'OWNS'},
    {from:'ahmed', to:'org', label:'MEMBER_OF'},
    {from:'acc1', to:'acc2', label:'TRANSFERRED ₹2.4L', flagged:true},
    {from:'acc2', to:'faisal', label:'OWNED_BY'},
  ];

  const degree = {};
  NODES.forEach(n=>degree[n.id]=0);
  EDGES.forEach(e=>{ degree[e.from]++; degree[e.to]++; });

  const TYPE_STROKE = { person:'#6FA79E', phone:'#8792A6', vehicle:'#8792A6', location:'#B98F52', account:'#8792A6', org:'#8792A6' };
  const TYPE_FILL   = { person:'rgba(63,140,130,0.14)', phone:'rgba(135,146,166,0.10)', vehicle:'rgba(135,146,166,0.10)', location:'rgba(217,142,59,0.10)', account:'rgba(135,146,166,0.10)', org:'rgba(135,146,166,0.10)' };

  /* ---------------- Stepper ---------------- */
  const stepperEl = document.getElementById('stepper');
  PIPELINE.forEach((name,i)=>{
    const d = document.createElement('div');
    d.className='step'; d.id='step-'+i;
    d.innerHTML = '<span class="dot"></span><span>'+name+'</span>';
    stepperEl.appendChild(d);
  });
  function setStage(i){
    PIPELINE.forEach((_,idx)=>{
      const el = document.getElementById('step-'+idx);
      el.classList.toggle('done', idx < i);
      el.classList.toggle('active', idx === i);
    });
  }

  /* ---------------- Sources list ---------------- */
  const sourcesEl = document.getElementById('sources');
  SOURCES.forEach(s=>{
    const row = document.createElement('div');
    row.className='source'; row.id='src-'+s.id;
    row.innerHTML = '<div class="icon">'+s.tag+'</div><div class="meta"><div class="name">'+s.name+'</div><div class="status">Queued</div></div>';
    sourcesEl.appendChild(row);
  });

  /* ---------------- Log ---------------- */
  const logEl = document.getElementById('log');
  function log(html){
    const line = document.createElement('div');
    line.className='log-line'; line.innerHTML = html;
    logEl.appendChild(line);
    requestAnimationFrame(()=>line.classList.add('in'));
    logEl.scrollTop = logEl.scrollHeight;
  }
  function wait(ms){ return new Promise(r=>setTimeout(r, reduced ? Math.min(ms,80) : ms)); }

  /* ---------------- Graph rendering ---------------- */
  const svgNS = "http://www.w3.org/2000/svg";
  const viewport = document.getElementById('viewport');
  const svg = document.getElementById('graph');
  let selectedId = null;

  function el(tag, attrs){
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const nodeGroups = {};
  function buildGraph(){
    // edges first (under nodes)
    EDGES.forEach(e=>{
      const a = NODES.find(n=>n.id===e.from), b = NODES.find(n=>n.id===e.to);
      const line = el('line', {x1:a.x, y1:a.y, x2:b.x, y2:b.y, class:'edge'+(e.flagged?' flagged':'')});
      const len = Math.hypot(b.x-a.x, b.y-a.y);
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      line.dataset.len = len;
      viewport.appendChild(line);
      e._el = line;
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const t = el('text', {x:mx, y:my-4, class:'edge-label'+(e.flagged?' flagged':''), 'text-anchor':'middle'});
      t.textContent = e.label; t.style.opacity=0;
      viewport.appendChild(t);
      e._label = t;
    });
    NODES.forEach(n=>{
      const r = 14 + degree[n.id]*3;
      const g = el('g', {class:'node'+(n.flagged?' flagged':''), transform:'translate('+n.x+','+n.y+') scale(0.4)', 'data-id':n.id});
      g.style.opacity = 0;
      if (n.flagged) g.appendChild(el('circle', {class:'ring', r:r+8, fill:'none', stroke:'var(--amber)', 'stroke-width':1.4}));
      g.appendChild(el('circle', {class:'body', r:r, fill:TYPE_FILL[n.type], stroke:TYPE_STROKE[n.type]}));
      const label = el('text', {y:r+15, 'text-anchor':'middle'});
      label.textContent = n.label;
      const sub = el('text', {class:'sub', y:r+27, 'text-anchor':'middle'});
      sub.textContent = n.sub;
      g.appendChild(label); g.appendChild(sub);
      g.addEventListener('pointerdown', (ev)=>{ ev.stopPropagation(); });
      g.addEventListener('click', (ev)=>{ ev.stopPropagation(); selectNode(n.id); });
      viewport.appendChild(g);
      nodeGroups[n.id] = g;
    });
  }
  buildGraph();

  function revealGraph(){
    let i=0;
    NODES.forEach(n=>{
      const g = nodeGroups[n.id];
      setTimeout(()=>{
        g.style.transition = reduced ? 'opacity 200ms ease' : 'opacity 280ms ease, transform 480ms cubic-bezier(.2,.9,.3,1)';
        g.style.opacity = 1;
        g.setAttribute('transform', 'translate('+n.x+','+n.y+') scale(1)');
      }, i*80);
      i++;
    });
    EDGES.forEach((e,idx)=>{
      setTimeout(()=>{
        e._el.style.transition = 'stroke-dashoffset 420ms ease-out';
        e._el.style.strokeDashoffset = 0;
        e._label.style.transition = 'opacity 300ms ease';
        e._label.style.opacity = 1;
      }, 260 + idx*70);
    });
    setTimeout(()=>{ document.getElementById('graphHint').classList.add('show'); }, 900);
  }

  /* ----- pan (1:1 drag, momentum spring on release) ----- */
  let panX=0, panY=0, dragging=false, startX=0, startY=0, baseX=0, baseY=0;
  let history=[];
  const bounds = {minX:-160, maxX:160, minY:-120, maxY:120};
  const panSpringX = new Spring(0, {damping:1, response:0.5, onUpdate:v=>{ panX=v; applyPan(); }});
  const panSpringY = new Spring(0, {damping:1, response:0.5, onUpdate:v=>{ panY=v; applyPan(); }});
  function applyPan(){ viewport.setAttribute('transform', 'translate('+panX+','+panY+')'); }
  function clampRubber(v, lo, hi){
    if (v<lo) return lo - (lo-v)*0.35;
    if (v>hi) return hi + (v-hi)*0.35;
    return v;
  }
  svg.addEventListener('pointerdown', (ev)=>{
    dragging = true; svg.classList.add('grabbing');
    svg.setPointerCapture(ev.pointerId);
    startX=ev.clientX; startY=ev.clientY; baseX=panX; baseY=panY;
    history=[{x:ev.clientX,y:ev.clientY,t:performance.now()}];
  });
  svg.addEventListener('pointermove', (ev)=>{
    if (!dragging) return;
    const scale = 880/svg.getBoundingClientRect().width;
    const dx=(ev.clientX-startX)*scale, dy=(ev.clientY-startY)*scale;
    panX = clampRubber(baseX+dx, bounds.minX, bounds.maxX);
    panY = clampRubber(baseY+dy, bounds.minY, bounds.maxY);
    applyPan();
    history.push({x:ev.clientX,y:ev.clientY,t:performance.now()});
    if (history.length>5) history.shift();
  });
  function endDrag(ev){
    if (!dragging) return;
    dragging=false; svg.classList.remove('grabbing');
    let vx=0, vy=0;
    if (history.length>=2){
      const a=history[0], b=history[history.length-1];
      const dt=(b.t-a.t)||16;
      const scale = 880/svg.getBoundingClientRect().width;
      vx = (b.x-a.x)*scale/dt*16; vy=(b.y-a.y)*scale/dt*16;
    }
    const targetX = Math.min(Math.max(panX + vx*4, bounds.minX), bounds.maxX);
    const targetY = Math.min(Math.max(panY + vy*4, bounds.minY), bounds.maxY);
    panSpringX.value=panX; panSpringX.set(targetX, vx*8);
    panSpringY.value=panY; panSpringY.set(targetY, vy*8);
  }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  /* ---------------- Right panel ---------------- */
  const rightPanel = document.getElementById('rightPanel');
  function swapPanel(renderFn){
    rightPanel.style.transition = 'opacity 160ms ease';
    rightPanel.style.opacity = 0;
    setTimeout(()=>{
      renderFn();
      rightPanel.style.opacity = 1;
    }, reduced ? 0 : 160);
  }

  function renderIdlePanel(){
    rightPanel.innerHTML =
      '<h2>Case Metrics</h2>'+
      row('Entities discovered','438')+
      row('Persons','126')+
      row('Phones','94')+
      row('Locations','31')+
      row('Organizations','12')+
      row('Relationships','1,842')+
      '<p class="empty-hint" style="margin-top:16px;">Select any node in the graph to inspect its connections and, where flagged, the full evidence trail behind it.</p>';
  }
  function row(k,n){ return '<div class="metric-row"><span class="k">'+k+'</span><span class="n mono">'+n+'</span></div>'; }

  function renderPlainNode(n){
    rightPanel.innerHTML =
      '<div class="detail-title">'+n.label+'</div>'+
      '<div class="detail-sub">'+n.sub+' &middot; '+degree[n.id]+' connection'+(degree[n.id]===1?'':'s')+'</div>'+
      '<p class="empty-hint">No anomaly indicators for this entity. It appears in the case record but was not flagged by the analytics engine.</p>'+
      '<table class="indicator-table"><tr><td>Appears in</td><td>CDR-882</td></tr><tr><td>Confidence</td><td>0.94</td></tr></table>';
  }

  function renderFlaggedNode(){
    rightPanel.innerHTML =
      '<div class="badge">Flagged &middot; bridge entity</div>'+
      '<div class="detail-title">Ahmed Sheikh</div>'+
      '<div class="detail-sub">Person &middot; connects 3 communities</div>'+
      '<table class="indicator-table">'+
        indicatorRow('Betweenness centrality','0.82')+
        indicatorRow('Connections','47')+
        indicatorRow('Communities connected','3')+
        indicatorRow('Transaction anomaly','+320%',true)+
        indicatorRow('Communication spike','+180%',true)+
        indicatorRow('Evidence sources','12')+
      '</table>'+
      '<h2>Evidence Path</h2>'+
      '<div class="evidence-path" id="evidencePath"></div>'+
      '<button class="ghost" id="viewSourceBtn">View source documents</button>';

    const hops = [
      {stamp:'①', flag:false, rel:'USES', text:'Ravi Kumar → Phone 9876543210'},
      {stamp:'②', flag:true,  rel:'CALLED', text:'Phone 9876543210 → Ahmed Sheikh'},
      {stamp:'③', flag:false, rel:'OWNS', text:'Ahmed Sheikh → A/C ••4521'},
      {stamp:'④', flag:true,  rel:'TRANSFERRED ₹2.4L', text:'A/C ••4521 → A/C ••7788'},
      {stamp:'⑤', flag:false, rel:'OWNED BY', text:'A/C ••7788 → Faisal Khan'},
    ];
    const wrap = document.getElementById('evidencePath');
    hops.forEach((h,i)=>{
      const d = document.createElement('div');
      d.className = 'hop'+(h.flag?' flag':'');
      d.innerHTML = '<div class="stamp">'+h.stamp+'</div><div class="txt"><div class="rel">'+h.rel+'</div>'+h.text+'</div>';
      wrap.appendChild(d);
      setTimeout(()=>d.classList.add('in'), 120*i);
    });
    document.getElementById('viewSourceBtn').addEventListener('click', openModal);
  }
  function indicatorRow(k,v,up){ return '<tr><td>'+k+'</td><td class="'+(up?'up':'')+'">'+v+'</td></tr>'; }

  function selectNode(id){
    if (selectedId){ nodeGroups[selectedId].classList.remove('selected'); }
    selectedId = id;
    nodeGroups[id].classList.add('selected');
    const n = NODES.find(x=>x.id===id);
    swapPanel(()=> n.flagged ? renderFlaggedNode() : renderPlainNode(n));
  }

  renderIdlePanel();

  /* ---------------- Modal ---------------- */
  const modalLayer = document.getElementById('modal-layer');
  const modalBody = document.getElementById('modalBody');
  function openModal(){
    modalBody.innerHTML =
      '<h3>TX-219 &middot; Transaction Record</h3>'+
      '<div class="doc-id mono">EV-041 &middot; extracted from transactions.csv</div>'+
      '<div class="doc-body">Transfer of ₹2,40,000 from account ending 4521 to account ending 7788, timestamped two days before the FIR-104 filing. Flagged by the rule engine for an amount and frequency well above the sender\'s historical baseline.</div>'+
      '<div class="verify-row"><span class="check">✓</span> Integrity verified &middot; Merkle root matches ledger</div>'+
      '<div class="hashrow">sha256 · 9f2a1c…e0b47d &middot; model NER-v1.4 &middot; pipeline v2.1</div>'+
      '<button class="close" id="closeModal">Close</button>';
    modalLayer.classList.add('open');
    document.getElementById('closeModal').addEventListener('click', closeModal);
  }
  function closeModal(){ modalLayer.classList.remove('open'); }
  modalLayer.addEventListener('click', (ev)=>{ if (ev.target===modalLayer) closeModal(); });

  /* ---------------- Pipeline run ---------------- */
  const runBtn = document.getElementById('runBtn');
  let hasRun = false;
  runBtn.addEventListener('click', async ()=>{
    if (hasRun) return;
    hasRun = true;
    runBtn.disabled = true; runBtn.textContent = 'Processing…';

    setStage(0);
    log('Ingesting <b>4</b> source documents (2 FIR, 1 CDR, 1 transaction ledger)…');
    await wait(500);
    SOURCES.forEach(s=>{
      const row = document.getElementById('src-'+s.id);
      row.classList.add('processed');
      row.querySelector('.status').textContent = 'Hashed & stored';
    });

    setStage(1);
    log('Normalizing names, phone numbers and account identifiers…');
    await wait(500);

    setStage(2);
    log('Running multilingual NER — <b>9</b> candidate entities extracted.');
    await wait(600);

    setStage(3);
    log('Resolving "R. Kumar" → <b>Ravi Kumar</b> (score 0.91, high confidence).');
    await wait(550);

    setStage(4);
    log('Building knowledge graph — <b>9</b> nodes, <b>9</b> relationships.');
    await wait(500);
    revealGraph();
    await wait(900);

    setStage(5);
    log('Computing betweenness centrality — <b>Ahmed Sheikh</b> bridges 3 communities.');
    await wait(650);

    setStage(6);
    log('Explainability layer attached — indicators + evidence path generated.');
    await wait(500);

    setStage(7);
    log('Verifying integrity — Merkle root anchored to ledger. ✓');
    await wait(400);

    runBtn.textContent = 'Pipeline complete';
    setTimeout(()=>{ selectNode('ahmed'); }, 300);
  });

})();
</script>
</body>
