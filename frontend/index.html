<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VERITAS — Investigator Console</title>
<link rel="stylesheet" href="./graph/graph.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --ink:#F3F4F6; /* Softer, slightly darker background */
    --graphite:#FAFAFA; /* Less harsh white for panels */
    --graphite-2:#E5E7EB;
    --hairline:rgba(0,0,0,0.15); /* Stronger borders */
    --hairline-strong:rgba(0,0,0,0.28); /* Much stronger prominent borders */
    --text:#030712; /* Pitch black for maximum contrast */
    --text-dim:#1F2937; /* Darker dim text */
    --text-faint:#4B5563; /* Darker faint text */
    --paper:#FAFAFA; 
    --paper-dim:#D1D5DB;
    --amber:#B45309; /* Deeper amber for better contrast */
    --amber-dim:rgba(180,83,9,0.15);
    --teal:#0F766E;
    --teal-dim:rgba(15,118,110,0.15);
    --steel:#6B7280; /* Darker steel for graph edges */
    --radius:14px;
    font-size:16px;
  }
  @media (prefers-contrast: more){
    :root{ --hairline:rgba(0,0,0,0.2); --text-dim:#374151; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(15,118,110,0.05), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(217,119,6,0.04), transparent 55%),
      var(--ink);
    color:var(--text);
    font:400 15px/1.5 -apple-system, ui-sans-serif, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Menlo", "Cascadia Code", monospace; letter-spacing:0.01em; }

  /* ---------- App shell ---------- */
  #app{ display:flex; flex-direction:column; height:100vh; }

  header.topbar{
    display:flex; align-items:center; gap:22px;
    padding:14px 22px;
    border-bottom:1px solid var(--hairline);
    background:rgba(255,255,255,0.75);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    flex-shrink:0;
    z-index:10;
  }
  @media (prefers-transparency: reduce){
    header.topbar{ background:var(--graphite); backdrop-filter:none; }
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mark{
    width:9px; height:9px; border-radius:2px;
    background:var(--amber);
    box-shadow:0 0 0 3px var(--amber-dim);
  }
  .brand h1{
    margin:0; font-size:15px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
  }
  
  .sidebar-toggle-btn{
    width:28px; height:28px; border-radius:7px;
    border:1px solid var(--hairline-strong);
    background:#F9FAFB; color:var(--text-dim);
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:13px;
    transition: background 150ms ease, transform 100ms ease;
    margin-right:2px;
  }
  .sidebar-toggle-btn:hover{ background:#F3F4F6; color:var(--text); }
  .sidebar-toggle-btn:active{ transform:scale(0.95); }

  .case-selector-wrap{ position:relative; display:inline-flex; align-items:center; }
  .case-badge-btn{
    font-family:ui-monospace, "SF Mono", "Menlo", monospace;
    font-size:12px; color:var(--text);
    background:rgba(0,0,0,0.04);
    border:1px solid var(--hairline-strong);
    border-radius:6px; padding:3px 8px;
    cursor:pointer; display:flex; align-items:center; gap:5px;
    transition: background 150ms ease;
  }
  .case-badge-btn:hover{ background:rgba(0,0,0,0.08); }
  .case-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; z-index:60;
    background:var(--paper); border:1px solid var(--hairline-strong);
    border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.15);
    width:240px; padding:6px; display:none;
  }
  .case-dropdown.open{ display:block; animation:dropdown-in 160ms ease-out; }
  @keyframes dropdown-in{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  .case-item{
    padding:8px 10px; border-radius:6px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--text); transition:background 120ms ease;
  }
  .case-item:hover{ background:var(--graphite-2); }
  .case-item.active{ background:var(--teal-dim); color:var(--teal); font-weight:600; }
  .case-item .case-count{ font-size:10.5px; color:var(--text-faint); font-family:ui-monospace, monospace; }

  .case-item-new{
    margin-top:4px; padding:7px 10px; border-top:1px solid var(--hairline);
    border-radius:6px; cursor:pointer; font-size:11.5px; font-weight:600;
    color:var(--teal); display:flex; align-items:center; gap:6px;
    transition:background 120ms ease;
  }
  .case-item-new:hover{ background:var(--teal-dim); }

  .new-case-btn{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:600; color:var(--teal);
    background:var(--teal-dim); border:1px solid rgba(15,118,110,0.25);
    border-radius:6px; padding:3px 8px; cursor:pointer;
    transition:background 150ms ease, transform 100ms ease;
  }
  .new-case-btn:hover{ background:rgba(15,118,110,0.22); }
  .new-case-btn:active{ transform:scale(0.96); }

  .stepper{ display:flex; align-items:center; gap:0; flex:1; overflow:hidden; }
  .step{
    display:flex; align-items:center; gap:8px;
    padding:0 14px 0 0; position:relative;
    color:var(--text-faint); font-size:12px; letter-spacing:0.06em; white-space:nowrap;
  }
  .step .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--steel); flex-shrink:0;
    transition:background 320ms ease, box-shadow 320ms ease;
  }
  .step.done .dot{ background:var(--teal); box-shadow:0 0 0 3px var(--teal-dim); }
  .step.active .dot{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); animation:pulse-dot 1.6s ease-in-out infinite; }
  .step.done, .step.active{ color:var(--text); }
  .step:not(:last-child)::after{
    content:""; width:22px; height:1px; background:var(--hairline-strong); margin:0 10px;
  }
  @keyframes pulse-dot{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.35);} }
  @media (prefers-reduced-motion: reduce){ .step.active .dot{ animation:none; } }

  main.layout{
    flex:1; display:grid;
    grid-template-columns: 272px 1fr 340px;
    min-height:0;
    transition: grid-template-columns 220ms cubic-bezier(.2,.9,.3,1);
  }
  main.layout.sidebar-collapsed{
    grid-template-columns: 0px 1fr 340px;
  }

  .panel{
    border-right:1px solid var(--hairline);
    padding:18px 16px;
    overflow-y:auto;
    min-height:0;
    transition: opacity 180ms ease, padding 220ms ease;
  }
  main.layout.sidebar-collapsed .panel.left{
    padding-left:0; padding-right:0; overflow:hidden; opacity:0; pointer-events:none; border-right:none;
  }
  .panel.right{ border-right:none; border-left:1px solid var(--hairline); }

  .panel h2{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--text-faint); margin:0 0 12px 0; font-weight:600;
  }

  /* ---------- Source intake ---------- */
  .source{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:10px;
    border:1px solid var(--hairline); margin-bottom:8px;
    background:rgba(0,0,0,0.015);
  }
  .source .icon{
    width:28px; height:28px; border-radius:7px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--graphite-2); color:var(--text-dim); font-size:10px; font-weight:700;
  }
  .source .meta{ min-width:0; flex:1; }
  .source .meta .name{ font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .source .meta .status{ font-size:10.5px; color:var(--text-faint); margin-top:1px; }
  .source.processed .icon{ background:var(--teal-dim); color:var(--teal); }
  .source.processed .status{ color:var(--teal); }

  .source .actions{ display:flex; align-items:center; margin-left:auto; padding-left:6px; }
  .source-del-btn{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--hairline-strong);
    background:transparent; color:var(--text-faint); font-size:15px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: background 150ms ease, color 150ms ease, transform 100ms ease;
  }
  .source-del-btn:hover{ background:#FEE2E2; color:#DC2626; border-color:#FCA5A5; }
  .source-del-btn:active{ transform:scale(0.92); }
  .source-locked-icon{ font-size:12px; color:var(--teal); opacity:0.85; cursor:help; padding-right:2px; }

  .drop-zone-hint{
    border:1.5px dashed var(--hairline-strong); border-radius:10px;
    padding:16px 10px; text-align:center; color:var(--text-faint);
    font-size:11.5px; margin-bottom:12px; transition:all 180ms ease;
    background:rgba(0,0,0,0.015);
  }
  .drop-zone-hint.drag-over,
  .panel.left.drag-over{
    border-color:var(--amber) !important;
    background:var(--amber-dim) !important;
  }

  button.run{
    width:100%; margin-top:14px; padding:11px 14px;
    border-radius:10px; border:1px solid var(--amber);
    background:var(--amber-dim); color:var(--amber);
    font-size:13px; font-weight:600; letter-spacing:0.03em;
    cursor:pointer; transition:transform 100ms ease-out, background 150ms ease;
  }
  button.run:active{ transform:scale(0.97); }
  button.run:disabled{ opacity:0.45; cursor:default; }
  button.run:not(:disabled):hover{ background:rgba(217,119,6,0.22); }

  .upload-btn{
    font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid #E5E7EB;
    background:#F9FAFB; color:#4B5563; cursor:pointer; font-weight:600;
    transition: background 150ms ease, transform 100ms ease;
  }
  .upload-btn:hover{ background:#F3F4F6; }
  .upload-btn:active{ transform:scale(0.96); }

  .log{ margin-top:16px; }
  .log-line{
    font-size:11.5px; color:var(--text-dim); padding:4px 0;
    border-bottom:1px dashed var(--hairline); opacity:0;
    transform:translateY(4px);
  }
  .log-line.in{ opacity:1; transform:translateY(0); transition:opacity 260ms ease, transform 260ms ease; }
  .log-line b{ color:var(--text); font-weight:600; }

  /* ---------- Right panel content ---------- */
  .stack{ transition:opacity 200ms ease; }
  .metric-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0; border-bottom:1px solid var(--hairline);
    font-size:12.5px;
  }
  .metric-row .n{ font-family:ui-monospace, monospace; color:var(--text); font-weight:600; font-size:13px; }
  .metric-row .k{ color:var(--text-dim); }

  .detail-title{ font-size:16px; font-weight:700; letter-spacing:-0.01em; margin:0 0 2px 0; }
  .detail-sub{ font-size:11.5px; color:var(--text-faint); margin-bottom:14px; }
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:100px; border:1px solid var(--amber);
    color:var(--amber); background:var(--amber-dim); margin-bottom:12px; font-weight:600;
  }
  .indicator-table{ width:100%; border-collapse:collapse; margin-bottom:16px; }
  .indicator-table tr td{ padding:6px 0; border-bottom:1px solid var(--hairline); font-size:12px; }
  .indicator-table tr td:first-child{ color:var(--text-dim); }
  .indicator-table tr td:last-child{ text-align:right; font-family:ui-monospace,monospace; color:var(--text); font-weight:600; }
  .indicator-table tr td:last-child.up{ color:var(--amber); }

  .evidence-path{ margin-top:6px; margin-bottom:16px; }
  .hop{
    display:flex; align-items:flex-start; gap:10px;
    opacity:0; transform:translateX(-6px) scale(0.97);
    padding-bottom:12px; position:relative;
  }
  .hop.in{ opacity:1; transform:translateX(0) scale(1); transition:opacity 320ms ease, transform 320ms cubic-bezier(.2,.9,.3,1); }
  .hop:not(:last-child)::before{
    content:""; position:absolute; left:9px; top:22px; bottom:-2px; width:1px;
    background:repeating-linear-gradient(to bottom, var(--hairline-strong) 0 4px, transparent 4px 8px);
  }
  .hop .stamp{
    width:19px; height:19px; border-radius:5px; flex-shrink:0; margin-top:1px;
    background:var(--graphite-2); border:1px solid var(--hairline-strong);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--text-dim);
  }
  .hop.flag .stamp{ background:var(--amber-dim); border-color:var(--amber); color:var(--amber); }
  .hop .txt{ font-size:12px; color:var(--text); line-height:1.4; }
  .hop .txt .rel{ color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; }

  button.ghost{
    width:100%; padding:9px 12px; border-radius:9px;
    border:1px solid var(--hairline-strong); background:transparent; color:var(--text);
    font-size:12.5px; cursor:pointer; transition:transform 100ms ease-out, background 150ms ease;
  }
  button.ghost:active{ transform:scale(0.97); }
  button.ghost:hover{ background:rgba(0,0,0,0.04); }

  .empty-hint{ color:var(--text-faint); font-size:12.5px; line-height:1.6; }

  /* ---------- Modal (source viewer) ---------- */
  #modal-layer{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.45);
    backdrop-filter: blur(6px);
    opacity:0; pointer-events:none;
  }
  #modal-layer.open{ opacity:1; pointer-events:auto; transition:opacity 220ms ease; }
  .modal{
    width:min(520px, 90vw);
    background:var(--paper); color:var(--text);
    border-radius:16px; padding:22px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
    transform:translateY(14px) scale(0.98); opacity:0;
  }
  #modal-layer.open .modal{ transform:translateY(0) scale(1); opacity:1; transition:transform 280ms cubic-bezier(.2,.9,.3,1), opacity 240ms ease; }
  .modal h3{ margin:0 0 4px 0; font-size:16px; letter-spacing:-0.01em; }
  .modal .doc-id{ font-family:ui-monospace,monospace; font-size:11px; color:#6B7280; margin-bottom:14px; }
  .modal .doc-body{
    font-size:13px; line-height:1.6; color:#111827; background:#F9FAFB;
    border-radius:10px; padding:14px; margin-bottom:14px; border:1px solid #E5E7EB;
  }
  .modal .verify-row{
    display:flex; align-items:center; gap:8px; font-size:11.5px; color:#0F766E; font-weight:600;
    margin-bottom:16px;
  }
  .modal .verify-row .check{
    width:16px; height:16px; border-radius:50%; background:#0F766E; color:white;
    display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
  }
  .modal .hashrow{ font-family:ui-monospace,monospace; font-size:10.5px; color:#8A8F9C; margin-bottom:18px; word-break:break-all; }
  .modal button.close{
    padding:9px 16px; border-radius:9px; border:1px solid #E5E7EB; background:#F3F4F6; color:#111827;
    font-size:12.5px; cursor:pointer; transition:transform 100ms ease-out;
  }
  .modal button.close:active{ transform:scale(0.96); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--hairline-strong); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  svg#graph.hide-orphans .node.orphan { display: none; }

  /* ---------- Tabs ---------- */
  .tabs-header { display:flex; border-bottom:1px solid #E5E7EB; margin-bottom:16px; }
  .tab-btn { padding:10px 16px; cursor:pointer; color:#6B7280; font-weight:600; font-size:13px; border-bottom:2px solid transparent; }
  .tab-btn:hover { color:#111827; }
  .tab-btn.active { color:#0F766E; border-bottom-color:#0F766E; }
  .badge-pill { background:#B45309; color:white; border-radius:10px; padding:2px 8px; font-size:11px; margin-left:6px; }
  .review-card { border:1px solid #E5E7EB; border-radius:8px; padding:12px; margin-bottom:12px; background:white; }
  .review-card.conflict { border-color:#FCA5A5; background:#FEF2F2; }
  .review-card.ambiguity { border-color:#FDE68A; background:#FFFBEB; }
  .review-actions { display:flex; gap:8px; margin-top:12px; }
  .review-actions button { padding:6px 12px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .review-actions .btn-merge { background:#0F766E; color:white; }
  .review-actions .btn-reject { background:#EF4444; color:white; }
  .review-actions .btn-skip { background:#F3F4F6; color:#4B5563; border-color:#D1D5DB; }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <button class="sidebar-toggle-btn" id="toggleSidebarBtn" title="Toggle Evidence Intake Sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
      </button>
      <span class="mark"></span>
      <h1>Veritas</h1>
      <div class="case-selector-wrap">
        <button class="case-badge-btn" id="caseSelectorBtn" title="Select or Switch Case">
          <span id="currentCaseLabel">CASE-102</span>
          <span style="font-size:9px;color:var(--text-faint);margin-left:2px;">▼</span>
        </button>
        <div class="case-dropdown" id="caseDropdown"></div>
      </div>
    </div>
    <div class="stepper" id="stepper"></div>
  </header>

  <main class="layout">

    <section class="panel left">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
         <h2 style="margin: 0;">Evidence Intake</h2>
         <label class="upload-btn">
            Upload
            <input type="file" id="fileUpload" multiple accept=".txt,.csv,.pdf" style="display:none;" />
         </label>
      </div>
      <div id="sources"></div>
      <button class="run" id="runBtn" disabled>Run pipeline</button>
      <div class="log" id="log"></div>
    </section>

    <section class="graph-wrap">
      <div class="graph-caption">
          <strong id="graphCount">0</strong>&nbsp;entities shown &middot; <strong id="flaggedCount" style="color:var(--amber);">0</strong>&nbsp;flagged subnetwork
          <label style="margin-left: 16px; font-size: 11px; cursor:pointer; user-select:none;">
             <input type="checkbox" id="toggleOrphans" checked style="vertical-align:middle; margin-right:4px;"> 
             <span id="orphanLabel">Show orphans</span>
          </label>
      </div>
      <svg id="graph" viewBox="0 0 880 520" preserveAspectRatio="xMidYMid meet">
        <g id="viewport"></g>
      </svg>
      <div class="graph-hint" id="graphHint">Drag to pan &middot; click a node to inspect</div>
    </section>

    <section class="panel right" id="rightPanel"></section>

  </main>
</div>

<div id="modal-layer">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module">
  import { MLGraph } from './graph/graph.js';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- Spring engine ---------------- */
  class Spring{
    constructor(value, opts={}){
      this.value=value; this.velocity=opts.velocity||0; this.target=value;
      this.damping = opts.damping ?? 1.0;
      this.response = opts.response ?? 0.35;
      this.onUpdate = opts.onUpdate || (()=>{});
      this.onSettle = opts.onSettle || (()=>{});
      this._raf=null;
    }
    jump(v){ this.value=v; this.target=v; this.velocity=0; this.onUpdate(this.value); }
    set(target, velocityBoost){
      this.target = target;
      if (velocityBoost !== undefined) this.velocity = velocityBoost;
      if (reduced){ this.jump(target); this.onSettle(); return; }
      this._run();
    }
    _run(){
      if (this._raf) return;
      let last = performance.now();
      const step = (now) => {
        const dt = Math.min((now-last)/1000, 0.032); last = now;
        const w = 2*Math.PI/this.response;
        const F = -2*this.damping*w*this.velocity - w*w*(this.value-this.target);
        this.velocity += F*dt;
        this.value += this.velocity*dt;
        this.onUpdate(this.value);
        if (Math.abs(this.value-this.target) < 0.05 && Math.abs(this.velocity) < 0.05){
          this.value = this.target; this.onUpdate(this.value);
          this._raf = null; this.onSettle();
          return;
        }
        this._raf = requestAnimationFrame(step);
      };
      this._raf = requestAnimationFrame(step);
    }
  }

  /* ---------------- Data model ---------------- */
  const PIPELINE = ["Ingest","Normalize","Extract","Resolve","Graph","Analyze","Explain","Verify"];
  let SOURCES = [];

  let NODES = [];
  let EDGES = [];
  let degree = {};
  let mlGraph = null;

  const DEMO_NODES = [
    {id:'ravi', name:'Ravi Kumar', type:'Person', phone:'+91 9876543210', x:180, y:170, status:'CLEAR'},
    {id:'phone', name:'9876543210', type:'Phone', phone:'+91 9876543210', x:160, y:280, status:'CLEAR'},
    {id:'vehicle', name:'MH 12 AB 1234', type:'Vehicle', x:60, y:220, status:'CLEAR'},
    {id:'loc', name:'Hyderabad', type:'Location', x:430, y:420, status:'CLEAR'},

  window.openNewCasePrompt = async function() {
    const caseName = prompt("Enter new Case ID (e.g. CASE-103 or 103):", `CASE-${Math.floor(100 + Math.random() * 900)}`);
    if (!caseName || !caseName.trim()) return;
    let formattedCaseId = caseName.trim().toUpperCase();
    if (!formattedCaseId.startsWith("CASE-")) {
      formattedCaseId = `CASE-${formattedCaseId}`;
    }

    try {
      await fetch('http://localhost:8000/api/cases', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({case_id: formattedCaseId})
      });
    } catch(e) {
      console.warn("Backend offline, saving locally:", e);
    }

    if (!KNOWN_CASES.some(c => c.case_id === formattedCaseId)) {
      KNOWN_CASES.push({case_id: formattedCaseId, document_count: 0, files: []});
      saveCaseHistory(KNOWN_CASES);
    }

    SOURCES = [];
    hasRun = false;
    runBtn.textContent = 'Run pipeline';
    runBtn.disabled = true;
    renderSources();
    switchCase(formattedCaseId);

        NODES = (graphData.nodes || []).map(n => ({

          flagged: n.flagged || n.status === 'REVIEW_REQUIRED' || n.risk_color === 'red'
        }));
        EDGES = graphData.links || graphData.edges || [];
      }
    } catch(e) {
      console.warn(e);
    }

    if (!NODES.length) {
      loadDemoGraph();
    } else {
      if (mlGraph) {
        try { mlGraph.simulation && mlGraph.simulation.stop(); } catch(e) {}
        mlGraph = null;
      }
      mlGraph = new MLGraph('graph', 'viewport', NODES, EDGES, (n) => selectNode(n.id));

  // Shared intake handler for click & drag-and-drop (Task 1)
  function handleFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    files.forEach(file => {
      // Avoid exact duplicates in current list
      if (SOURCES.some(s => s.name === file.name)) return;
      let tag = 'DOC';
      const lowerName = file.name.toLowerCase();
      if (lowerName.includes('fir')) tag = 'FIR';
      else if (lowerName.includes('cdr')) tag = 'CDR';
      else if (lowerName.includes('txn') || lowerName.includes('transaction') || lowerName.includes('bank')) tag = 'TXN';
      else if (lowerName.includes('surveillance') || lowerName.includes('intel')) tag = 'INTEL';
      else if (lowerName.includes('interrogation')) tag = 'DOC';

      SOURCES.push({
        id: 'src_' + Math.random().toString(36).substr(2, 9),
        name: file.name,
        tag: tag,
        file: file,
        status: 'Queued',
        processed: false
      });
    });
    renderSources();
  }

          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: action})

          window._pendingReview = window._pendingReview.filter(item => {
             const id = item.type === 'PHONE_CONFLICT' ? item.names.join('-') : `${item.candidate?.id}-${item.possible_match?.id}`;
             return id !== reviewId;
          });
          renderRightPanel();
       } else {

  function getDetailsHTML() {
    if (!selectedId) {
      const persons = NODES.filter(n => (n.type || '').toLowerCase() === 'person').length;

      const accounts = NODES.filter(n => (n.type || '').toLowerCase() === 'account').length;
      const flagged = NODES.filter(n => n.flagged || n.status === 'REVIEW_REQUIRED' || n.risk_color === 'red').length;
      
      return `<h2>Case Metrics</h2>
        <div class="metric-row"><span class="k">Entities discovered</span><span class="n mono">${NODES.length}</span></div>
        <div class="metric-row"><span class="k">Relationships</span><span class="n mono">${EDGES.length}</span></div>

      const items = window._pendingReview || [];

      return items.map(item => {

         }

  let selectedId = null;
  function selectNode(id){
    selectedId = id;
    const n = NODES.find(x=>x.id===id);
    if(!n) return;
    
    if (n.status === 'REVIEW_REQUIRED' || n.flagged) {
        window._currentTab = 'details';
        renderRightPanel();
        
        // If there's an active review item matching this node, highlight in review tab if user switches
        setTimeout(() => {
           const items = window._pendingReview || [];
           const match = items.find(item => {
               if(item.type === 'PHONE_CONFLICT') return false;
               return item.candidate?.id === id || item.possible_match?.id === id;
           });
           if (match) {
               const cardId = `review-card-${match.candidate?.id}-${match.possible_match?.id}`;
               const el = document.getElementById(cardId);
               if(el) {
                   el.scrollIntoView({behavior: 'smooth', block: 'start'});
                   el.style.outline = '2px solid #0F766E';

      '<h3>' + (n.name || n.id) + ' &middot; ' + typeLabel + ' Record</h3>'+
      '<div class="doc-id mono">EV-041 &middot; extracted from ' + sourceDoc + '</div>'+
      '<div class="doc-body"><strong>Excerpt from Source Document / Evidence Trail:</strong><br><br><i>' + evidenceText + '</i></div>'+
      '<div class="verify-row"><span class="check">✓</span> Integrity verified &middot; Merkle root matches ledger</div>'+
      '<div class="hashrow">sha256 · 9f2a1c…e0b47d &middot; model NER-v1.4 &middot; pipeline v2.1</div>'+
      '<button class="close" id="closeModal">Close</button>';
    modalLayer.classList.add('open');
    document.getElementById('closeModal').addEventListener('click', closeModal);
  }
  function closeModal(){ modalLayer.classList.remove('open'); }
  modalLayer.addEventListener('click', (ev)=>{ if (ev.target===modalLayer) closeModal(); });

  /* ---------------- Pipeline run ---------------- */
  let hasRun = false;
  runBtn.addEventListener('click', async ()=>{
    if (hasRun) return;
    hasRun = true;
    runBtn.disabled = true; runBtn.textContent = 'Processing…';

    setStage(0);
    log(`Ingesting <b>${SOURCES.length}</b> source documents...`);
    await wait(500);
    SOURCES.forEach(s=>{
      s.processed = true;
      s.status = 'Hashed & stored';
      const row = document.getElementById('src-'+s.id);
      if (row) {
        row.classList.add('processed');
        const st = row.querySelector('.status');
        if (st) st.textContent = 'Hashed & stored';
        const actions = row.querySelector('.actions');
        if (actions) actions.innerHTML = '<span class="source-locked-icon" title="Ingested into graph (retraction requires ledger rollback)">🔒</span>';
      }
    });

    setStage(1);
    log('Normalizing names, phone numbers and account identifiers…');
    await wait(500);

    setStage(2);
    log('Running multilingual NER — candidate entities extracted.');
    await wait(600);

    setStage(3);
    log('Sending documents to ML API for resolution...');
    
    const formData = new FormData();
    const uploadedFiles = [];

    let caseId = CURRENT_CASE || 'CASE-102';
    
    SOURCES.filter(s => s.file).forEach(s => {
        uploadedFiles.push(s.file);
        formData.append('files', s.file);
    });

    try {
       if (uploadedFiles.length === 0) {
         log('No files uploaded. Generating live test data to run through backend ML pipeline...');
         const demoFiles = [
            new File(["FIRST INFORMATION REPORT\n\nRavi Kumar was seen driving vehicle MH-12-AB-1234 near Hyderabad. Suspect is known to use phone number +91-9876543210."], "FIR_002_Andheri.txt", {type: "text/plain"}),
            new File(["caller_number,callee_number,duration,timestamp\n+919876543210,+919998887776,120,2024-01-01T10:00:00"], "CDR_Ravi_Jan2024.csv", {type: "text/csv"}),
            new File(["INTELLIGENCE REPORT - SUSPECT PROFILING\n\nSubject Ahmed Sheikh is associated with Crescent Traders. He uses phone number +91-9998887776. Faisal Khan was also seen in Hyderabad."], "Surveillance_Rep_03.txt", {type: "text/plain"}),
            new File(["sender_account,receiver_account,amount,timestamp\nACC-AHMED-4521,ACC-FAISAL-7788,240000,2024-03-14T12:00:00"], "BankStatement_GlobalTech.csv", {type: "text/csv"}),
            new File(["INTERROGATION SUMMARY\n\nAhmed Sheikh admitted that account ACC-AHMED-4521 belongs to him. Faisal Khan operates account ACC-FAISAL-7788."], "Interrogation_JohnDoe.txt", {type: "text/plain"}),
         ];
         demoFiles.forEach(f => formData.append('files', f));
         caseId = CURRENT_CASE || ('CASE-' + Math.floor(Math.random() * 10000));
         formData.set('case_id', caseId);
       } else {
         formData.set('case_id', caseId);
       }
       
       const res = await fetch('http://localhost:8000/api/process-evidence', {
           method: 'POST',
           body: formData
       });
         
         if (!res.ok) throw new Error('API returned ' + res.status);
         
         const mlData = await res.json();
         // Refresh cases history
         fetchCases();
         if (mlData.statuses && mlData.statuses.length) {
            mlData.statuses.forEach(s => {
              if (s.status === 'rejected_low_relevance') {
                log(`<span style="color:#D97706">⚠️ <b>${s.filename}</b>: Skipped — ${s.reason || s.message}</span>`);
              } else if (s.status === 'error') {
                log(`<span style="color:red">❌ <b>${s.filename}</b>: ${s.message}</span>`);
              }
            });
          }
          // Capture needs_review items from this batch for the review queue UI
         const batchReview = mlData.needs_review || [];
         if (batchReview.length) {
           log(`<span style="color:#B45309">⚠ ${batchReview.length} item(s) added to review queue — see Review Queue below.</span>`);
         }
         window._pendingReview = (window._pendingReview || []).concat(batchReview);
         
         // Fetch the full graph from the database
         log('Fetching complete graph from Neo4j...');
         const graphRes = await fetch(`http://localhost:8000/api/cases/${caseId}/graph`);
         if (!graphRes.ok) throw new Error('Graph API returned ' + graphRes.status);
         const graphData = await graphRes.json();
         
         // Normalize: backend returns 'value' for display name; map it to 'name'
         // so graph.js label renderer can find it consistently.
          NODES = (graphData.nodes || []).map(n => {
              const rawType = (n.type || n.label || 'Entity').toString();
              const formattedType = rawType.charAt(0).toUpperCase() + rawType.slice(1).toLowerCase();
              return {
                  ...n,
                  name: n.name || n.value || n.label || n.id,
                  type: formattedType === 'Org' ? 'Organization' : formattedType,
                  flagged: n.flagged || n.status === 'REVIEW_REQUIRED' || n.risk_color === 'red'
              };
          });
          // Support both key names: process-evidence returns 'links', graph endpoint returns 'edges'
          EDGES = (graphData.links || graphData.edges || []).map(e => ({
              ...e,
              line_type: e.flagged || e.status === 'suggested' ? 'dotted' : 'solid'
          }));
         
         if (!NODES.length) {
           loadDemoGraph();
           log('Neo4j returned no graph data, so the demo graph was loaded instead.');
         }
       
       // Always rebuild the graph with fresh data (supports re-uploads)
       if (mlGraph) {
           // Destroy old simulation before creating new one
           try { mlGraph.simulation && mlGraph.simulation.stop(); } catch(e) {}
           mlGraph = null;
       }
       mlGraph = new MLGraph('graph', 'viewport', NODES, EDGES, (n) => selectNode(n.id));
       mlGraph.buildGraph();
       updateHeaderCounts();
       log(`Building knowledge graph — <b>${NODES.length}</b> nodes, <b>${EDGES.length}</b> relationships.`);
    } catch(e) {
       log('<span style="color:red">Failed to load graph from ML API. Loading the fallback network instead.</span>');
       console.error(e);
       loadDemoGraph();
       mlGraph = new MLGraph('graph', 'viewport', NODES, EDGES, (n) => selectNode(n.id));
       mlGraph.buildGraph();
       updateHeaderCounts();
       log(`Building fallback knowledge graph — <b>${NODES.length}</b> nodes, <b>${EDGES.length}</b> relationships.`);
    }
    await wait(550);

    setStage(4);
    mlGraph.revealGraph();
    await wait(900);

    setStage(5);
    log('Analyzing subnetworks for high-risk flags...');
    await wait(650);

    setStage(6);
    log('Explainability layer attached — indicators generated.');
    await wait(500);

    setStage(7);
    log('Pipeline completed. Awaiting investigator review.');
    await wait(400);

     runBtn.textContent = 'Pipeline complete';
     updateHeaderCounts();
     
     // Auto-select a flagged node if one exists
     const flagged = NODES.find(n => n.status === 'REVIEW_REQUIRED' || n.flagged);
     if (flagged) {
         setTimeout(()=>{ 
             mlGraph.selectNodeUI(flagged.id);
             selectNode(flagged.id); 
         }, 300);
     }

     if (window._pendingReview && window._pendingReview.length > 0) {
         renderRightPanel();
     }
  });

</script>
</body>
</html>
